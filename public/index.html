<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="brand-bar" aria-label="Calcly header">
      <button id="menuButton" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="appMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div id="appMenu" class="menu-popover" hidden>
        <button id="shortcutsOption" type="button">Keyboard shortcuts</button>
      </div>

      <div class="brand-mark" aria-hidden="true">
        <span>+</span>
        <span>-</span>
        <span>x</span>
        <span>&divide;</span>
      </div>
      <h1>Calcly</h1>
    </header>

    <section class="workspace" aria-label="Calculator workspace">
      <section class="calculator-panel" aria-label="Calculator">
        <div class="display-card">
          <div id="expression" class="expression"></div>
          <output id="display" class="result" aria-live="polite"></output>
        </div>

        <div class="memory-row" aria-label="Memory controls">
          <button type="button" data-memory="clear">MC</button>
          <button type="button" data-memory="recall">MR</button>
          <button type="button" data-memory="add">M+</button>
          <button type="button" data-memory="subtract">M&minus;</button>
          <button type="button" data-memory="store">MS</button>
        </div>

        <div class="key-grid" aria-label="Calculator keypad">
          <button class="key operator" type="button" data-action="percent">%</button>
          <button class="key operator" type="button" data-action="clear-entry">CE</button>
          <button class="key operator" type="button" data-action="clear">C</button>
          <button class="key operator backspace" type="button" data-action="backspace" aria-label="Backspace">&#9003;</button>

          <button class="key operator" type="button" data-action="reciprocal">1/x</button>
          <button class="key operator" type="button" data-action="square">x<sup>2</sup></button>
          <button class="key operator" type="button" data-action="sqrt"><sup>2</sup>&radic;x</button>
          <button class="key operator" type="button" data-operator="/">&divide;</button>

          <button class="key number" type="button" data-number="7">7</button>
          <button class="key number" type="button" data-number="8">8</button>
          <button class="key number" type="button" data-number="9">9</button>
          <button class="key operator" type="button" data-operator="*">&times;</button>

          <button class="key number" type="button" data-number="4">4</button>
          <button class="key number" type="button" data-number="5">5</button>
          <button class="key number" type="button" data-number="6">6</button>
          <button class="key operator" type="button" data-operator="-">&minus;</button>

          <button class="key number" type="button" data-number="1">1</button>
          <button class="key number" type="button" data-number="2">2</button>
          <button class="key number" type="button" data-number="3">3</button>
          <button class="key operator" type="button" data-operator="+">+</button>

          <button class="key number" type="button" data-action="toggle-sign">+/&minus;</button>
          <button class="key number" type="button" data-number="0">0</button>
          <button class="key number" type="button" data-action="decimal">.</button>
          <button class="key equals" type="button" data-action="equals">=</button>
        </div>
      </section>

      <aside class="history-panel" aria-label="Calculation history">
        <div class="tabs">
          <button class="tab active" type="button">History</button>
          <button class="tab" type="button">Memory</button>
          <button id="panelMoreButton" class="more-tab" type="button" aria-label="Keyboard shortcuts">...</button>
        </div>

        <div id="historyList" class="history-list" aria-live="polite"></div>

        <button id="clearHistory" class="clear-history" type="button">
          <span class="trash-icon" aria-hidden="true"></span>
          <span id="clearHistoryLabel">Clear History</span>
        </button>
      </aside>
    </section>

    <section id="shortcutPanel" class="shortcut-panel" aria-label="Keyboard shortcuts" hidden>
      <div class="shortcut-header">
        <h2>Keyboard shortcuts</h2>
        <button id="closeShortcuts" type="button" aria-label="Close keyboard shortcuts">&times;</button>
      </div>
      <dl class="shortcut-list">
        <div><dt>0-9</dt><dd>Type numbers</dd></div>
        <div><dt>+ - * /</dt><dd>Choose operator</dd></div>
        <div><dt>Enter</dt><dd>Calculate result</dd></div>
        <div><dt>Backspace</dt><dd>Delete last digit</dd></div>
        <div><dt>Esc / C</dt><dd>Clear display</dd></div>
        <div><dt>%</dt><dd>Percent</dd></div>
        <div><dt>M</dt><dd>Switch History / Memory</dd></div>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
